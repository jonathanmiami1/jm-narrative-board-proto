<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sample Idea button · Feedback tool</title>
<style>body{font-family:system-ui,sans-serif;background:#eef1f6;margin:0;padding:24px}.card{max-width:420px;margin:auto;background:#fff;border-radius:14px;padding:24px}button{padding:10px 14px;margin-right:6px;border-radius:8px;border:1px solid #ccc;background:#fff}button.on{background:#334;color:#fff}textarea{width:100%;margin-top:12px;min-height:70px}.tag{background:#fde8b0;padding:3px 8px;border-radius:6px;font-size:12px}ul{padding-left:18px}</style></head>
<body><div class="card" id="feedback-idea"><span class="tag">Sample screen</span><h1 style="font-size:20px">Feedback tool: Fix / Idea / Bug</h1>
<button>Fix</button><button class="on" id="idea">Idea</button><button>Bug</button><textarea id="t" placeholder="Type a sample idea"></textarea><button onclick="var t=document.getElementById('t');if(t.value){var li=document.createElement('li');li.textContent=t.value;document.getElementById('ideas').appendChild(li);t.value=''}">Save note</button>
<h3>Ideas</h3><ul id="ideas"></ul><p style="font-size:13px;color:#666">What to check: press Idea, type a sample note and confirm it lands under Ideas.</p></div></body></html>
