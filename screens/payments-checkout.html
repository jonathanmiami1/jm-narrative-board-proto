<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sample checkout screen · Chiro Payments</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f1ea;margin:0;padding:24px;color:#222}.card{max-width:420px;margin:auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 10px #0001}h1{font-size:20px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:#2f6b4f;color:#fff;font-size:16px}.tag{background:#fde8b0;padding:3px 8px;border-radius:6px;font-size:12px}</style></head>
<body><div class="card" id="payments-checkout"><span class="tag">Sample screen · sample world</span><h1>Chiro Payments: checkout</h1><p>Sample visit for a sample member.</p>
<div class="row"><span>Visit</span><span>Adjustment, sample</span></div><div class="row"><span>Copay per visit</span><span>Sample flat amount</span></div><div class="row"><span>Card</span><span>Sample card ending 0000</span></div>
<button onclick="this.textContent='Paid (sample, nothing charged)'">Pay copay</button><p style="font-size:13px;color:#666">What to check: the copay line and the Pay button label.</p></div></body></html>
